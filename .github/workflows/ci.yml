name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.3

# Third-party code is pinned: actions to a full commit hash, images and SDKs to an
# exact version, so a moved tag can't change what runs here.
jobs:
  dart:
    name: Dart analyze and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test

  kotlin:
    name: Kotlin unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # gradlew and local.properties aren't in git: Flutter generates them.
      - name: Generate Gradle files
        run: flutter build apk --config-only
      - name: Run tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain
      # The Android libraries (LiteRT, media3, AndroidX, ...) have no lockfile of their own:
      # write one for what goes into the release app, then check it for known vulnerabilities.
      - name: List the release app's Android libraries
        working-directory: android
        run: >-
          ./gradlew --init-script ../.github/gradle/lock-release.init.gradle.kts
          :app:dependencies --configuration releaseRuntimeClasspath --write-locks
          --no-daemon --console=plain -q
      - name: Scan Android libraries for known vulnerabilities
        run: docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.7.0 scan -L /src/android/app/gradle.lockfile

  release:
    name: Release build (R8)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # R8 shrinking, resource shrinking and the native libraries' packaging run only in a release
    # build: a missing keep rule would otherwise first show up while preparing a Play upload.
    # Signed with the debug key (no secrets here); the Gradle guard allows that only with this.
    env:
      ALLOW_DEBUG_SIGNING: 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build appbundle --release

  security:
    name: Secret and dependency scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0 # the whole history: a secret stays exposed after it is removed
      - name: Scan git history for secrets
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner
      - name: Scan Dart dependencies for known vulnerabilities
        run: docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.7.0 scan -L /src/pubspec.lock
